name: Bug report
description: Report a reproducible implementation or protocol problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tenant identifiers, or private prompts.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands, input, and the smallest safe example.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, and relevant package versions.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and customer/private data.
          required: true
        - label: I checked existing issues.
          required: true
