[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maf-langgraph-a2a-foundry"
version = "0.2.0"
description = "An apples-to-apples Microsoft Agent Framework and LangGraph comparison over A2A, powered by Microsoft Foundry."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Ko Ko" },
]
keywords = [
  "a2a",
  "agent-framework",
  "ai-agents",
  "langgraph",
  "microsoft-foundry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "a2a-sdk>=1.0.0,<2",
  "agent-framework-a2a==1.0.0b260721",
  "agent-framework-core>=1.12.1,<2",
  "agent-framework-foundry>=1.10.3,<2",
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "langchain>=1.2,<2",
  "langchain-azure-ai>=1.0,<2",
  "langgraph>=1.2.8,<2",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "sse-starlette>=3,<4",
  "starlette>=0.49,<1",
  "uvicorn[standard]>=0.37,<1",
]

[project.scripts]
agent-duet = "agent_duet.cli:main"
maf-a2a-server = "agent_duet.maf.server:main"
langgraph-a2a-server = "agent_duet.langgraph.server:main"
langgraph-inventory-a2a-server = "agent_duet.scenarios.inventory.server:main"

[dependency-groups]
dev = [
  "pyright>=1.1.407,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_duet"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires Microsoft Foundry credentials and live A2A servers",
]
filterwarnings = [
  "ignore:label\\(\\) is deprecated:DeprecationWarning:a2a\\.utils\\.proto_utils",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "RUF",
  "SIM",
  "UP",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["01_coscup_inventory_demo.py", "src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = ["agent_duet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
