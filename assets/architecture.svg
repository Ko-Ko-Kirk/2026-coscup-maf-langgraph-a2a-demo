<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">COSCUP 2026 MAF and LangGraph over A2A demo architecture</title>
  <desc id="desc">A Microsoft Agent Framework caller wraps a remote LangGraph inventory specialist as an A2A tool. The remote service runs an explicit inventory graph and returns an A2A artifact for an outer order policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <style>
      .title { font: 700 36px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #172033; }
      .subtitle { font: 400 22px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #475569; }
      .cluster-title { font: 700 24px "Arial Unicode MS", "PingFang TC", sans-serif; }
      .node-title { font: 700 19px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #172033; }
      .node-body { font: 400 16px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #334155; }
      .label { font: 600 15px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #475569; }
      .legend { font: 400 16px "Arial Unicode MS", "PingFang TC", sans-serif; fill: #475569; }
      .line { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#blue-arrow); }
      .purple-line { fill: none; stroke: #7C3AED; stroke-width: 4; marker-end: url(#purple-arrow); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#F5F7FB"/>
  <text x="900" y="62" text-anchor="middle" class="title">COSCUP 2026 Demo Architecture</text>
  <text x="900" y="100" text-anchor="middle" class="subtitle">MAF 把遠端 LangGraph Agent 包成一個 A2A Tool</text>

